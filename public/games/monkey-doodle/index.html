<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
  <title>爷爷大战猴子 - 画画比赛</title>
  <style>
    :root{
      --bg:#FFF0F5;
      --ui:#EC407A;
      --ui2:#C2185B;
      --paper:#ffffff;
      --paper-border:#F8BBD0;
      --cream:#FFF8E1;
      --accent:#EC407A;
      --danger:#D81B60;
      --ok:#2E7D32;
      --text:#5D4037;
    }

    html,body{
      margin:0;
      padding:0;
      height:100%;
      overflow:hidden;
      background:var(--bg);
      font-family:-apple-system,"Microsoft YaHei",sans-serif;
      touch-action:manipulation;
      -webkit-user-select:none;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
    }

    /* 用 dvh 避免 iPad Safari 地址栏变化导致高度错乱 */
    #app{
      height:100vh;
      display:flex;
      flex-direction:column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      box-sizing:border-box;
    }
    @supports (height: 100dvh){ #app{ height:100dvh; } }

    /* 顶部栏 */
    #top-bar{
      flex:0 0 auto;
      height:clamp(72px, 12vh, 110px);
      background:var(--ui);
      border-bottom:6px solid var(--ui2);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:0 16px;
      box-sizing:border-box;
    }
    .score-box{
      display:flex;
      flex-direction:column;
      gap:4px;
      min-width:120px;
    }
    .score-box.right{ align-items:flex-end; text-align:right; }
    .label{
      font-size:clamp(16px, 2vw, 26px);
      color:#FCE4EC;
      font-weight:900;
      letter-spacing:1px;
      line-height:1.1;
    }
    .value{
      font-size:clamp(30px, min(4.2vw, 5.5vh), 56px);
      color:#fff;
      font-weight:900;
      font-family:"Courier New",monospace;
      line-height:1;
    }
    .pill{
      background:#fff;
      border:4px solid var(--paper-border);
      border-radius:999px;
      padding:10px 18px;
      font-weight:900;
      color:var(--text);
      font-size:clamp(18px, 2.4vw, 30px);
      box-shadow:0 6px 0 rgba(0,0,0,0.15);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      min-width:0;
    }

    /* 通用按钮 */
    .btn{
      background:var(--accent);
      color:#fff;
      border:none;
      border-radius:999px;
      padding:12px 22px;
      font-weight:900;
      font-size:clamp(20px, 2.6vw, 32px);
      box-shadow:0 8px 0 var(--ui2);
      cursor:pointer;
      font-family:inherit;
      white-space:nowrap;
    }
    .btn:active{ transform:translateY(8px); box-shadow:none; }
    .btn.secondary{ background:#455A64; box-shadow:0 8px 0 #263238; }
    .btn.good{ background:#43A047; box-shadow:0 8px 0 #1B5E20; }
    .btn.pulse{ animation:btnPulse 0.5s ease-in-out infinite alternate; }
    @keyframes btnPulse{
      from{ transform:scale(1); }
      to  { transform:scale(1.08); filter:brightness(1.12); }
    }

    /* 主区域：横屏左右，竖屏上下 */
    #main{
      flex:1;
      min-height:0;
      display:flex;
      gap:clamp(12px, 2vw, 28px);
      padding:clamp(10px, 1.6vw, 22px);
      box-sizing:border-box;
    }
    .panel-title{
      font-weight:900;
      color:var(--danger);
      font-size:clamp(20px, 2.6vw, 32px);
      text-align:center;
      line-height:1.2;
    }
    .panel-title.small{ font-size:clamp(18px, 2.1vw, 26px); color:#6D4C41; }

    #g-panel{
      flex:1;
      min-width:0;
      min-height:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
    }
    .paper-wrap{
      flex:1;
      min-width:0;
      min-height:0;
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }
    canvas.paper{
      display:block;
      background:var(--paper);
      border:8px solid var(--paper-border);
      border-radius:28px;
      box-shadow:0 10px 0 rgba(236,64,122,0.18);
      box-sizing:border-box;
      touch-action:none;
    }
    #g-canvas{ cursor:crosshair; }

    #side{
      flex:0 0 auto;
      width:clamp(250px, 32vw, 420px);
      display:flex;
      flex-direction:column;
      gap:clamp(10px, 2vh, 20px);
      min-height:0;
    }
    .m-card{
      flex:1;
      min-height:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
    }
    #m-canvas{ border-color:#D7CCC8; box-shadow:0 10px 0 rgba(109,76,65,0.18); }

    #m-bubble{
      background:#fff;
      border:6px solid #D7CCC8;
      border-radius:24px;
      padding:8px 14px;
      font-weight:900;
      color:#6D4C41;
      font-size:clamp(18px, 2.2vw, 28px);
      text-align:center;
      line-height:1.3;
      min-height:1.3em;
      max-width:100%;
      box-sizing:border-box;
    }

    .actions{
      display:flex;
      flex-direction:column;
      gap:18px;
    }
    .actions .btn{ width:100%; }

    @media (orientation: portrait){
      #main{ flex-direction:column; }
      #side{
        width:auto;
        height:clamp(230px, 30vh, 360px);
        flex-direction:row;
      }
      .m-card{ flex:1; }
      .actions{ justify-content:center; min-width:clamp(180px, 32vw, 280px); }
    }

    /* 提示条 */
    #toast{
      position:absolute;
      left:50%;
      top:8px;
      transform:translateX(-50%);
      background:rgba(255,255,255,0.96);
      border:6px solid var(--paper-border);
      border-radius:24px;
      padding:10px 18px;
      font-weight:900;
      color:var(--text);
      font-size:clamp(20px, 2.6vw, 32px);
      z-index:40;
      display:none;
      max-width:92%;
      text-align:center;
      box-shadow:0 8px 0 rgba(0,0,0,0.12);
      white-space:nowrap;
    }

    /* 弹窗 */
    #modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.78);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:100;
      padding:16px;
    }
    .modal-content{
      background:var(--cream);
      border:10px solid var(--accent);
      border-radius:40px;
      width:min(680px, 96vw);
      max-height:94vh;
      overflow:auto;
      padding:24px 22px;
      text-align:center;
      box-shadow:0 18px 0 rgba(0,0,0,0.35);
      box-sizing:border-box;
    }
    .modal-content.wide{ width:min(860px, 96vw); }
    .modal-content h2{
      font-size:clamp(30px, min(4.6vw, 7vh), 60px);
      margin:0 0 12px 0;
      color:var(--danger);
      font-weight:900;
      letter-spacing:2px;
    }
    .modal-content p{
      font-size:clamp(22px, 2.8vw, 34px);
      color:var(--text);
      margin:10px 0 16px 0;
      font-weight:900;
      line-height:1.45;
    }
    .row{
      display:flex;
      gap:16px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:10px;
    }
    .big-emoji{
      font-size:clamp(60px, 9vw, 110px);
      line-height:1.1;
    }

    /* 结果对比 */
    .vs{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:clamp(10px, 2vw, 24px);
    }
    .vs-card{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
      padding:10px;
      border-radius:28px;
      border:6px solid transparent;
    }
    .vs-card.winner{
      border-color:#FFD54F;
      background:#FFFDE7;
      animation:winnerGlow 0.6s ease-in-out infinite alternate;
    }
    @keyframes winnerGlow{
      from{ box-shadow:0 0 0 rgba(255,193,7,0.0); }
      to  { box-shadow:0 0 28px rgba(255,193,7,0.9); }
    }
    .vs-who{
      font-weight:900;
      font-size:clamp(22px, 2.8vw, 34px);
      color:var(--text);
    }
    .vs-card canvas{
      width:clamp(120px, min(26vw, 25vh), 260px);
      height:clamp(120px, min(26vw, 25vh), 260px);
      border-width:6px;
      border-radius:20px;
      box-shadow:none;
    }
    .vs-score{
      font-weight:900;
      font-family:"Courier New",monospace;
      font-size:clamp(36px, min(6vw, 8vh), 76px);
      color:var(--danger);
      line-height:1;
    }
    .vs-score small{ font-size:0.45em; font-family:-apple-system,"Microsoft YaHei",sans-serif; }
    .vs-mid{
      font-weight:900;
      font-size:clamp(30px, 4vw, 54px);
      color:#BDBDBD;
    }
    .final-score{
      font-weight:900;
      font-size:clamp(48px, 8vw, 100px);
      color:var(--text);
      line-height:1.2;
    }
    .final-score b{ color:var(--danger); font-family:"Courier New",monospace; }
  </style>
</head>

<body>
  <div id="app">
    <div id="top-bar">
      <div class="score-box">
        <div class="label">👴 爷爷赢</div>
        <div class="value" id="g-wins">0</div>
      </div>

      <div class="pill" id="round-pill">第 1 题：☀️ 太阳</div>

      <div class="score-box right">
        <div class="label">🐵 猴子赢</div>
        <div class="value" id="m-wins">0</div>
      </div>
    </div>

    <div id="main">
      <section id="g-panel">
        <div class="panel-title" id="g-title">👴 爷爷照着虚线描一描</div>
        <div class="paper-wrap" id="g-wrap">
          <canvas class="paper" id="g-canvas"></canvas>
          <div id="toast"></div>
        </div>
      </section>

      <aside id="side">
        <div class="m-card">
          <div class="panel-title small">🐵 猴子也在画</div>
          <div class="paper-wrap" id="m-wrap">
            <canvas class="paper" id="m-canvas"></canvas>
          </div>
          <div id="m-bubble">🐵 看我的！</div>
        </div>

        <div class="actions">
          <button class="btn secondary" id="clear-btn">🧽 擦掉重画</button>
          <button class="btn good" id="done-btn">✅ 画好了</button>
        </div>
      </aside>
    </div>

    <!-- Modal -->
    <div id="modal">
      <div class="modal-content" id="start-screen">
        <h2>👴 爷爷大战猴子</h2>
        <div class="big-emoji">👴🎨🐵</div>
        <p>
          比一比谁画得像！<br>
          照着虚线描一描，<br>
          <span style="color:#D81B60;">描得越像，分数越高 ✅</span>
        </p>
        <p id="start-record" style="display:none;"></p>
        <div class="row">
          <button class="btn good" id="start-btn">开始比赛</button>
        </div>
      </div>

      <div class="modal-content wide" id="result-screen" style="display:none;">
        <h2 id="result-title">第 1 题 结果</h2>
        <div class="vs">
          <div class="vs-card" id="r-g-card">
            <div class="vs-who">👴 爷爷</div>
            <canvas class="paper" id="r-g-canvas"></canvas>
            <div class="vs-score"><span id="r-g-score">0</span><small> 分</small></div>
          </div>
          <div class="vs-mid">VS</div>
          <div class="vs-card" id="r-m-card">
            <div class="vs-who">🐵 猴子</div>
            <canvas class="paper" id="r-m-canvas"></canvas>
            <div class="vs-score"><span id="r-m-score">0</span><small> 分</small></div>
          </div>
        </div>
        <p id="result-msg">&nbsp;</p>
        <div class="row">
          <button class="btn good" id="next-btn">下一题 ➡️</button>
        </div>
      </div>

      <div class="modal-content" id="final-screen" style="display:none;">
        <h2 id="final-title">比赛结束！</h2>
        <div class="final-score">👴 <b id="final-g">0</b> : <b id="final-m">0</b> 🐵</div>
        <p id="final-msg"></p>
        <div class="row">
          <button class="btn good" id="again-btn">再比一场</button>
        </div>
      </div>
    </div>
  </div>

<script>
(() => {
  const ROUNDS = 5;
  const INK = ["#E53935", "#1E88E5", "#43A047", "#8E24AA", "#FB8C00"];
  const MONKEY_INK = "#795548";
  const WINS_KEY = "grandpa_doodle_match_wins";

  // ---------- 题目：都画在 0~100 的方格纸上 ----------
  function circlePts(cx, cy, r, from = 0, to = 360, step = 4){
    const pts = [];
    for (let a = from; a <= to + 0.001; a += step){
      const t = a * Math.PI / 180;
      pts.push([cx + Math.cos(t) * r, cy + Math.sin(t) * r]);
    }
    return pts;
  }

  // 把图形等比缩放到画纸中间
  function fit(polys, lo = 14, hi = 86){
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const p of polys) for (const [x, y] of p){
      minX = Math.min(minX, x); maxX = Math.max(maxX, x);
      minY = Math.min(minY, y); maxY = Math.max(maxY, y);
    }
    const s = (hi - lo) / Math.max(maxX - minX, maxY - minY);
    const ox = (100 - (maxX - minX) * s) / 2, oy = (100 - (maxY - minY) * s) / 2;
    return polys.map(p => p.map(([x, y]) => [(x - minX) * s + ox, (y - minY) * s + oy]));
  }

  function moonPolys(){
    // 外圆留下不在内圆里的部分，内圆留下在外圆里的部分 → 弯弯的月牙
    const A = { x: 50, y: 50, r: 38 }, B = { x: 68, y: 40, r: 32 };
    const inside = (c, x, y) => Math.hypot(x - c.x, y - c.y) < c.r;
    const outer = circlePts(A.x, A.y, A.r, 0, 360, 2).filter(([x, y]) => !inside(B, x, y));
    const inner = circlePts(B.x, B.y, B.r, 0, 360, 2).filter(([x, y]) => inside(A, x, y));
    // 两段都从角度 0 开始数，接缝在右边，按顺序把它们排好
    const order = pts => {
      let cut = 0, best = 0;
      for (let i = 0; i < pts.length; i++){
        const j = (i + 1) % pts.length;
        const d = Math.hypot(pts[j][0] - pts[i][0], pts[j][1] - pts[i][1]);
        if (d > best){ best = d; cut = j; }
      }
      return pts.slice(cut).concat(pts.slice(0, cut));
    };
    return [order(outer), order(inner)];
  }

  const SHAPES = [
    { name: "太阳", emoji: "☀️", polys: () => [circlePts(50, 50, 36)] },
    { name: "爱心", emoji: "❤️", polys: () => {
        const pts = [];
        for (let a = 0; a <= 360; a += 3){
          const t = a * Math.PI / 180;
          pts.push([16 * Math.sin(t) ** 3, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))]);
        }
        return [pts];
      } },
    { name: "星星", emoji: "⭐", polys: () => {
        const pts = [];
        for (let i = 0; i <= 10; i++){
          const t = (-90 + i * 36) * Math.PI / 180;
          const r = i % 2 ? 0.42 : 1;
          pts.push([Math.cos(t) * r, Math.sin(t) * r]);
        }
        return [pts];
      } },
    { name: "小房子", emoji: "🏠", polys: () => [
        [[20, 90], [20, 50], [50, 20], [80, 50], [80, 90], [20, 90]],
        [[42, 90], [42, 68], [58, 68], [58, 90]],
      ] },
    { name: "小鱼", emoji: "🐟", polys: () => {
        const body = [];
        for (let a = 0; a <= 360; a += 4){
          const t = a * Math.PI / 180;
          body.push([42 + Math.cos(t) * 30, 50 + Math.sin(t) * 18]);
        }
        return [body, [[72, 50], [92, 34], [92, 66], [72, 50]]];
      } },
    { name: "月亮", emoji: "🌙", polys: moonPolys },
    { name: "大山", emoji: "⛰️", polys: () => [
        [[6, 80], [30, 38], [44, 58], [62, 20], [94, 80], [6, 80]],
      ] },
    { name: "小花", emoji: "🌸", polys: () => {
        const pts = [];
        for (let a = 0; a <= 360; a += 2){
          const t = a * Math.PI / 180;
          const r = 30 + 12 * Math.cos(5 * t);
          pts.push([50 + Math.cos(t) * r, 50 + Math.sin(t) * r]);
        }
        return [pts, circlePts(50, 50, 8, 0, 360, 15)];
      } },
    { name: "眼镜", emoji: "👓", polys: () => [
        circlePts(28, 55, 17, 0, 360, 6),
        circlePts(72, 55, 17, 0, 360, 6),
        [[45, 52], [50, 46], [55, 52]],
      ] },
    { name: "彩虹", emoji: "🌈", polys: () => [
        circlePts(50, 70, 40, 180, 360, 4),
        circlePts(50, 70, 24, 180, 360, 4),
        [[10, 70], [26, 70]],
        [[74, 70], [90, 70]],
      ] },
  ];

  // ---------- 元素 ----------
  const gCanvas = document.getElementById("g-canvas");
  const mCanvas = document.getElementById("m-canvas");
  const gCtx = gCanvas.getContext("2d");
  const mCtx = mCanvas.getContext("2d");
  const gWrap = document.getElementById("g-wrap");
  const mWrap = document.getElementById("m-wrap");

  const elToast = document.getElementById("toast");
  const elBubble = document.getElementById("m-bubble");
  const elPill = document.getElementById("round-pill");
  const elGWins = document.getElementById("g-wins");
  const elMWins = document.getElementById("m-wins");

  const modal = document.getElementById("modal");
  const startScreen = document.getElementById("start-screen");
  const resultScreen = document.getElementById("result-screen");
  const finalScreen = document.getElementById("final-screen");

  const btnStart = document.getElementById("start-btn");
  const btnClear = document.getElementById("clear-btn");
  const btnDone = document.getElementById("done-btn");
  const btnNext = document.getElementById("next-btn");
  const btnAgain = document.getElementById("again-btn");

  // 本地音效（找不到也不报错）
  const sfxClick = new Audio("./assets/click.mp3");
  sfxClick.preload = "auto";
  const sfxGood = new Audio("./assets/correct.mp3");
  sfxGood.preload = "auto";
  const sfxWin = new Audio("./assets/win.mp3");
  sfxWin.preload = "auto";

  function playSfx(a){
    try{ a.currentTime = 0; a.play().catch(()=>{}); }catch(e){}
  }

  // 语音播报（可选）
  function speak(text){
    if (!("speechSynthesis" in window)) return;
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-CN";
      u.rate = 0.95;
      u.pitch = 1.05;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function toast(msg, ms = 1600){
    elToast.textContent = msg;
    elToast.style.display = "block";
    clearTimeout(toast._t);
    toast._t = setTimeout(() => elToast.style.display = "none", ms);
  }

  function say(msg){
    elBubble.textContent = msg;
  }

  // ---------- 比赛状态 ----------
  let order = [];
  let round = 0;
  let gWins = 0, mWins = 0;
  let shape = null;        // { name, emoji, polys, samples }
  let ink = INK[0];
  let strokes = [];        // 爷爷画的线（0~100 坐标）
  let drawing = null;
  let canDraw = false;

  let monkeyStrokes = [];
  let monkeyScore = 0;
  let monkeyTotal = 0;     // 猴子一共要画几个点
  let monkeyShown = 0;     // 已经画出来几个点
  let monkeyStart = 0;
  let monkeyDuration = 6000;
  let monkeyRaf = 0;
  let monkeyLines = [];

  // ---------- 几何小工具 ----------
  function resample(poly, stepLen){
    if (poly.length === 1) return [poly[0]];
    const out = [poly[0]];
    let carry = 0;
    for (let i = 1; i < poly.length; i++){
      const [x0, y0] = poly[i - 1], [x1, y1] = poly[i];
      const seg = Math.hypot(x1 - x0, y1 - y0);
      let d = stepLen - carry;
      while (d <= seg){
        const t = d / seg;
        out.push([x0 + (x1 - x0) * t, y0 + (y1 - y0) * t]);
        d += stepLen;
      }
      carry = seg - (d - stepLen);
    }
    return out;
  }

  // 打分：虚线描到了多少（覆盖）× 画的线贴不贴虚线（准确）
  // 离虚线越近分越高，慢慢过渡，不会差一点就一下子没分
  function closeness(d, near, far){
    return Math.max(0, Math.min(1, 1 - (d - near) / (far - near)));
  }
  function minDist(x, y, pts){
    let best = Infinity;
    for (const [px, py] of pts){
      const dx = x - px, dy = y - py;
      const d = dx * dx + dy * dy;
      if (d < best) best = d;
    }
    return Math.sqrt(best);
  }
  function scoreDrawing(lines){
    const T = shape.samples;
    const U = [];
    for (const l of lines) U.push(...resample(l, 1));
    if (U.length < 6) return 0;

    let cov = 0;
    for (const [x, y] of T) cov += closeness(minDist(x, y, U), 2, 9);
    let prec = 0;
    for (const [x, y] of U) prec += closeness(minDist(x, y, T), 2.5, 11);

    const coverage = cov / T.length;
    const precision = prec / U.length;
    const raw = coverage * Math.pow(precision, 1.3);
    return Math.max(0, Math.min(100, Math.round(100 * Math.pow(raw, 0.75))));
  }

  // ---------- 画纸 ----------
  function sizeCanvas(canvas, wrap){
    const rect = wrap.getBoundingClientRect();
    const side = Math.max(120, Math.floor(Math.min(rect.width, rect.height)));
    canvas.style.width = side + "px";
    canvas.style.height = side + "px";
    fitBacking(canvas);
  }

  // 画布有边框：按内容区（clientWidth）来算像素和坐标
  function fitBacking(canvas){
    const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    canvas.width = Math.floor(canvas.clientWidth * dpr);
    canvas.height = Math.floor(canvas.clientHeight * dpr);
  }

  function paint(canvas, lines, color, opts = {}){
    const ctx = canvas.getContext("2d");
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(canvas.width / 100, 0, 0, canvas.height / 100, 0, 0);
    const px = 100 / Math.max(1, canvas.clientWidth); // 1 个屏幕像素在 0~100 坐标里有多长

    if (shape && opts.guide !== false){
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = opts.guideColor || "#B0BEC5";
      ctx.globalAlpha = opts.guideAlpha ?? 0.9;
      ctx.lineWidth = Math.max(2.2, 7 * px);
      ctx.setLineDash([5, 4]);
      for (const p of shape.polys){
        ctx.beginPath();
        p.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
        ctx.stroke();
      }
      ctx.restore();
    }

    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = opts.width || Math.max(2.6, 12 * px);
    for (const l of lines){
      if (!l.length) continue;
      if (l.length === 1){
        ctx.beginPath();
        ctx.arc(l[0][0], l[0][1], ctx.lineWidth / 2, 0, Math.PI * 2);
        ctx.fill();
        continue;
      }
      ctx.beginPath();
      l.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
      ctx.stroke();
    }
    ctx.restore();

    if (opts.pen){
      const [x, y] = opts.pen;
      ctx.save();
      ctx.font = "14px Arial";
      ctx.textAlign = "left";
      ctx.textBaseline = "bottom";
      ctx.fillText("✏️", x - 1, y + 2);
      ctx.restore();
    }
  }

  function layout(){
    // 先缩小画布，让外框按页面大小重新排版，再量尺寸
    for (const c of [gCanvas, mCanvas]){ c.style.width = "0px"; c.style.height = "0px"; }
    sizeCanvas(gCanvas, gWrap);
    sizeCanvas(mCanvas, mWrap);
    redrawGrandpa();
    redrawMonkey();
  }

  function redrawGrandpa(){
    paint(gCanvas, drawing ? strokes.concat([drawing]) : strokes, ink);
  }

  // ---------- 爷爷画画 ----------
  let activePointer = null;

  function toPaper(e){
    const rect = gCanvas.getBoundingClientRect();
    return [
      (e.clientX - rect.left - gCanvas.clientLeft) / gCanvas.clientWidth * 100,
      (e.clientY - rect.top - gCanvas.clientTop) / gCanvas.clientHeight * 100,
    ];
  }

  gCanvas.addEventListener("pointerdown", e => {
    e.preventDefault();
    if (!canDraw || activePointer !== null) return;
    activePointer = e.pointerId;
    try{ gCanvas.setPointerCapture(e.pointerId); }catch(err){}
    drawing = [toPaper(e)];
    redrawGrandpa();
  });

  gCanvas.addEventListener("pointermove", e => {
    if (e.pointerId !== activePointer || !drawing) return;
    e.preventDefault();
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (evs.length ? evs : [e])) drawing.push(toPaper(ev));
    redrawGrandpa();
  });

  function endStroke(e){
    if (e.pointerId !== activePointer) return;
    activePointer = null;
    if (drawing && drawing.length) strokes.push(drawing);
    drawing = null;
    redrawGrandpa();
  }
  gCanvas.addEventListener("pointerup", endStroke);
  gCanvas.addEventListener("pointercancel", endStroke);

  // ---------- 猴子画画 ----------
  function wobble(){
    const p = [Math.random() * 6, Math.random() * 6, Math.random() * 6, Math.random() * 6];
    const f = [0.05 + Math.random() * 0.05, 0.11 + Math.random() * 0.06];
    return (s, k) => Math.sin(s * f[0] + p[k * 2]) * 0.65 + Math.sin(s * f[1] + p[k * 2 + 1]) * 0.35;
  }

  function makeMonkeyDrawing(amp){
    const lines = [];
    const scale = 0.93 + Math.random() * 0.12;
    const shiftX = (Math.random() - 0.5) * 6, shiftY = (Math.random() - 0.5) * 6;
    const noise = wobble();
    let s = 0;
    let extra = "";

    for (const poly of shape.polys){
      const pts = resample(poly, 1).map(([x, y]) => {
        s += 1;
        return [
          50 + (x - 50) * scale + shiftX + noise(s, 0) * amp + (Math.random() - 0.5) * 0.8,
          50 + (y - 50) * scale + shiftY + noise(s, 1) * amp + (Math.random() - 0.5) * 0.8,
        ];
      });
      // 手一滑，漏掉一小段
      if (Math.random() < 0.4 && pts.length > 30){
        const len = Math.floor(pts.length * (0.08 + Math.random() * 0.14));
        const at = Math.floor(Math.random() * (pts.length - len));
        lines.push(pts.slice(0, at), pts.slice(at + len));
        extra = extra || "slip";
      }else{
        lines.push(pts);
      }
    }

    // 顺手画根香蕉
    if (Math.random() < 0.3){
      const cx = Math.random() < 0.5 ? 14 : 86, cy = Math.random() < 0.5 ? 14 : 86;
      lines.push(circlePts(cx, cy - 6, 9, 30, 150, 8));
      extra = "banana";
    }
    return { lines: lines.filter(l => l.length), extra };
  }

  function prepareMonkey(){
    // 猴子水平在 55~84 分之间晃，爷爷认真描就能赢
    const target = 55 + Math.random() * 29;
    let best = null;
    for (const amp of [2, 3, 4, 5, 6, 7.5, 9, 11, 13, 15]){
      const d = makeMonkeyDrawing(amp);
      const sc = scoreDrawing(d.lines);
      if (!best || Math.abs(sc - target) < Math.abs(best.sc - target)) best = { ...d, sc };
    }
    monkeyStrokes = best.lines;
    monkeyScore = best.sc;
    monkeyLines = best.extra === "banana"
      ? ["🐵 看我的！", "🐵 顺便画根香蕉 🍌", "🐵 我画完啦！"]
      : best.extra === "slip"
        ? ["🐵 看我的！", "🙊 哎呀，手滑了…", "🐵 我画完啦！"]
        : ["🐵 看我的！", "🐵 我画得可快啦！", "🐵 我画完啦！"];
    monkeyTotal = monkeyStrokes.reduce((n, l) => n + l.length, 0);
    monkeyShown = 0;
  }

  function visibleMonkey(n){
    const out = [];
    let left = n;
    for (const l of monkeyStrokes){
      if (left <= 0) break;
      out.push(l.slice(0, left));
      left -= l.length;
    }
    return out;
  }

  function redrawMonkey(){
    const lines = visibleMonkey(monkeyShown);
    const last = lines.length ? lines[lines.length - 1] : null;
    const drawingNow = monkeyShown > 0 && monkeyShown < monkeyTotal;
    paint(mCanvas, lines, MONKEY_INK, {
      guideAlpha: 0.55,
      pen: drawingNow && last && last.length ? last[last.length - 1] : null,
    });
  }

  function startMonkey(){
    cancelAnimationFrame(monkeyRaf);
    monkeyDuration = 5500 + Math.random() * 2500;
    monkeyStart = performance.now();
    say(monkeyLines[0]);
    const tick = now => {
      const t = Math.min(1, (now - monkeyStart) / monkeyDuration);
      monkeyShown = Math.floor(monkeyTotal * t);
      if (t > 0.45) say(monkeyLines[1]);
      redrawMonkey();
      if (t < 1){
        monkeyRaf = requestAnimationFrame(tick);
      }else{
        say(monkeyLines[2] + " 爷爷慢慢画～");
      }
    };
    monkeyRaf = requestAnimationFrame(tick);
  }

  function finishMonkeyNow(){
    cancelAnimationFrame(monkeyRaf);
    monkeyShown = monkeyTotal;
    redrawMonkey();
  }

  // ---------- 比赛流程 ----------
  function shuffle(a){
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function showModal(which){
    modal.style.display = "flex";
    startScreen.style.display = which === "start" ? "block" : "none";
    resultScreen.style.display = which === "result" ? "block" : "none";
    finalScreen.style.display = which === "final" ? "block" : "none";
  }
  function hideModal(){
    modal.style.display = "none";
  }

  function loadMatchWins(){
    try{ return parseInt(localStorage.getItem(WINS_KEY), 10) || 0; }catch(e){ return 0; }
  }
  function saveMatchWins(n){
    try{ localStorage.setItem(WINS_KEY, String(n)); }catch(e){}
  }

  function startMatch(){
    // 第一题总是最简单的太阳，后面随机
    order = [SHAPES[0], ...shuffle(SHAPES.slice(1)).slice(0, ROUNDS - 1)];
    round = 0;
    gWins = 0; mWins = 0;
    elGWins.textContent = "0";
    elMWins.textContent = "0";
    hideModal();
    nextRound();
  }

  function nextRound(){
    round++;
    const def = order[round - 1];
    const polys = fit(def.polys());
    shape = {
      name: def.name,
      emoji: def.emoji,
      polys,
      samples: polys.flatMap(p => resample(p, 1.5)),
    };
    ink = INK[(round - 1) % INK.length];
    strokes = [];
    drawing = null;
    canDraw = true;

    elPill.textContent = `第 ${round} / ${ROUNDS} 题：${shape.emoji} ${shape.name}`;
    document.getElementById("g-title").textContent = `👴 爷爷照着虚线画 ${shape.emoji}`;
    btnDone.classList.remove("pulse");

    prepareMonkey();
    hideModal();
    layout();
    say("🐵 准备……");
    speak(`第${round}题，画${shape.name}`);
    toast(`第 ${round} 题：画${shape.name} ${shape.emoji}`, 1800);
    setTimeout(() => { if (canDraw) startMonkey(); }, 900);
  }

  function clearDrawing(){
    if (!canDraw) return;
    playSfx(sfxClick);
    strokes = [];
    drawing = null;
    redrawGrandpa();
    toast("擦干净啦，重新描～");
  }

  function finishRound(){
    if (!canDraw) return;
    const inkPts = strokes.reduce((n, l) => n + l.length, 0);
    if (inkPts < 6){
      toast("爷爷还没画呢～ 照着虚线描一描", 2200);
      return;
    }
    canDraw = false;
    finishMonkeyNow();

    const gScore = scoreDrawing(strokes);
    const mScore = monkeyScore;

    // 结果页的小画
    const rg = document.getElementById("r-g-canvas");
    const rm = document.getElementById("r-m-canvas");
    showModal("result");
    fitBacking(rg);
    fitBacking(rm);
    paint(rg, strokes, ink, { guideAlpha: 0.5 });
    paint(rm, monkeyStrokes, MONKEY_INK, { guideAlpha: 0.5 });

    const gCard = document.getElementById("r-g-card");
    const mCard = document.getElementById("r-m-card");
    gCard.classList.remove("winner");
    mCard.classList.remove("winner");

    document.getElementById("result-title").textContent = `第 ${round} 题：${shape.emoji} ${shape.name}`;
    const elMsg = document.getElementById("result-msg");
    elMsg.innerHTML = "裁判打分中…";
    btnNext.style.visibility = "hidden";
    btnNext.textContent = round >= ROUNDS ? "看总成绩 🏆" : "下一题 ➡️";

    countUp(document.getElementById("r-g-score"), gScore);
    countUp(document.getElementById("r-m-score"), mScore);

    setTimeout(() => {
      let msg;
      if (gScore > mScore){
        gWins++;
        gCard.classList.add("winner");
        msg = gScore >= 85 ? "👴 爷爷赢啦！画得真像！🎉" : "👴 爷爷赢啦！🎉";
        say("🙈 爷爷画得太好了！");
        speak("爷爷赢啦！");
        playSfx(sfxGood);
      }else if (gScore < mScore){
        mWins++;
        mCard.classList.add("winner");
        msg = "🐵 这题猴子赢了！<br><span style=\"color:#D81B60;\">慢慢描，贴着虚线画，下题赢回来！</span>";
        say("🐵 嘿嘿，这题我赢啦！");
        speak("这题猴子赢了，爷爷加油！");
      }else{
        gWins++; mWins++;
        msg = "🤝 一样多分，平手！";
        say("🐵 跟爷爷一样厉害！");
        speak("平手！");
      }
      elGWins.textContent = gWins;
      elMWins.textContent = mWins;
      elMsg.innerHTML = msg;
      btnNext.style.visibility = "visible";
    }, 1300);
  }

  function countUp(el, to){
    const start = performance.now();
    const dur = 1100;
    const tick = now => {
      const t = Math.min(1, (now - start) / dur);
      el.textContent = Math.round(to * (1 - Math.pow(1 - t, 3)));
      if (t < 1) requestAnimationFrame(tick);
    };
    el.textContent = "0";
    requestAnimationFrame(tick);
    // 动画被浏览器暂停时，也保证最后显示正确分数
    setTimeout(() => { el.textContent = to; }, dur + 100);
  }

  function showFinal(){
    document.getElementById("final-g").textContent = gWins;
    document.getElementById("final-m").textContent = mWins;
    const elTitle = document.getElementById("final-title");
    const elMsg = document.getElementById("final-msg");

    if (gWins > mWins){
      const total = loadMatchWins() + 1;
      saveMatchWins(total);
      elTitle.textContent = "👑 爷爷是画画大王！";
      elMsg.innerHTML = `猴子输得心服口服 🙈<br><span style="color:#D81B60;">爷爷已经赢了猴子 ${total} 场！</span>`;
      speak("比赛结束，爷爷是画画大王！");
      playSfx(sfxWin);
    }else if (gWins < mWins){
      elTitle.textContent = "🐵 这场猴子赢了";
      elMsg.innerHTML = "猴子在偷笑 🐒<br>爷爷再来一场，赢回来！";
      speak("这场猴子赢了，爷爷再来一场！");
    }else{
      elTitle.textContent = "🤝 平手！";
      elMsg.innerHTML = "爷爷和猴子一样厉害！<br>再比一场分个高低！";
      speak("平手！再比一场！");
    }
    showModal("final");
  }

  btnStart.onclick = startMatch;
  btnAgain.onclick = startMatch;
  btnClear.onclick = clearDrawing;
  btnDone.onclick = finishRound;
  btnNext.onclick = () => {
    if (round >= ROUNDS) showFinal();
    else nextRound();
  };

  window.addEventListener("resize", () => layout(), { passive: true });

  // kick
  const record = loadMatchWins();
  if (record > 0){
    const el = document.getElementById("start-record");
    el.textContent = `🏆 爷爷已经赢了猴子 ${record} 场`;
    el.style.display = "";
  }
  shape = null;
  layout();
  showModal("start");
})();
</script>

</body>
